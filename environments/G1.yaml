group: G1
purpose: "Agent + AGENTS/CLAUDE.md + Project Skill：项目上下文工程能解决多少"
components:
  - name: AGENTS/CLAUDE.md
    note: "为每个任务仓库写同一份项目上下文说明（冻结后不得跨 run 修改）"
  - name: Project Skill
    note: "同一 Skill 修订版注入全部 G1 run"
install_commands:
  - "无安装；把冻结的 AGENTS/CLAUDE.md 放入任务仓库根目录"
forbidden:
  - "OpenSpec / Spec Kit"
  - "AEH"
  - "任何独立验证或 Gate 工具"
frozen_fields: [repository.commit_sha, agent.vendor, agent.product, agent.version, agent.model,
  harness.skill_revision, environment.os, environment.python_or_dotnet, environment.sandbox,
  environment.network, environment.timeout, input.task_prompt_sha256, input.config_sha256]
