tests:
  - id: TEST-001
    verifies: [AC-001-01, AC-002-01]
    kind: contract
    intent: "验证 format_price 对整美元、零和分值统一保留两位小数"
    command: "python -m unittest tests.test_format_price_contract -v"
    targets: ["src/pricing.py"]
